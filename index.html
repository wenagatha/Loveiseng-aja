<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crochet Heart — interactive cotton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="window">
      <div class="titlebar">Crochet Heart — interactive cotton</div>
      <canvas id="c" width="800" height="760"></canvas>
    </div>
    <div class="controls">
      <button id="speed">Cepat</button>
      <button id="restart">Ulang</button>
      <button id="save">Simpan PNG</button>
    </div>
    <p class="hint">Gerakkan mouse / sentuh layar untuk menarik benang</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
